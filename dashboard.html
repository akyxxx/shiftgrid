<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid — Attendance & Pay Tracker</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --card-bg: #0e1622;
            --card-inner: #141f2e;
            --card-border: #1a2636;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --badge-green: #00e676;
            --accent-green: #22c55e;
            --danger-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .brand-showcase {
            background: linear-gradient(135deg, #0e1726 0%, #080d16 100%);
            border: 1px solid #1a293d;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            padding: 4px;
        }

        .logo-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-tagline {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .header-status-pill {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.25);
            color: var(--badge-green);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--badge-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--badge-green);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-blue);
            background: #182536;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #60a5fa;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .user-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .user-email {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .settings-btn {
            background: #182332;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 16px;
        }

        .pay-cycle-card {
            background: linear-gradient(145deg, #132247 0%, #0d1522 100%);
            border: 1px solid #1d3b7a;
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .pay-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cycle-title {
            font-size: 12px;
            font-weight: 700;
            color: #93c5fd;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pay-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #dbeafe;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .earnings-amount {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .earnings-amount .currency {
            font-size: 14px;
            color: #93c5fd;
            font-weight: 600;
            margin-left: 4px;
        }

        .pay-card-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 14px 0;
        }

        .pay-card-footer {
            display: flex;
            justify-content: space-between;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .meta-value {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
        }

        .date-picker-btn {
            background: #142235;
            color: #60a5fa;
            border: 1px solid var(--primary-blue);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .history-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-select {
            background: #121c29;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        .shift-list, .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shift-item, .history-item {
            background-color: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shift-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .shift-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .btn-log {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .history-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .history-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .history-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-red);
            cursor: pointer;
            font-size: 16px;
        }

        .cal-modal-overlay, .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1050;
            padding: 16px;
        }

        .cal-card, .modal-card {
            background-color: #0b121b;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .cal-header, .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .btn-close-modal {
            background: #162232;
            border: none;
            color: var(--text-muted);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

        .form-input {
            width: 100%;
            background: #141f2e;
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        .btn-primary-block {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .btn-modal-link {
            width: 100%;
            background: #141f2e;
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-reset { border-color: #451a1a; color: var(--danger-red); background: transparent; }
    </style>
</head>
<body>

    <div class="brand-showcase">
        <div class="brand-logo-container">
            <div class="logo-icon-box">
                <img src="SiftGrid logo.png" alt="ShiftGrid Logo" onerror="this.style.display='none'">
            </div>
            <div class="brand-text">
                <span class="brand-name">ShiftGrid</span>
                <span class="brand-tagline">ATTENDANCE & PAY SYSTEM</span>
            </div>
        </div>
        <div class="header-status-pill">
            <span class="pulse-dot"></span>
            <span id="syncStatusText">Synced</span>
        </div>
    </div>

    <div class="profile-card">
        <div class="profile-info">
            <div id="profileAvatarDisplay" class="avatar-img">--</div>
            <div class="user-details">
                <span id="profileNameDisplay" class="user-name">Loading Account...</span>
                <div class="user-meta">
                    <span id="profileRoleBadge" class="role-badge">EMPLOYEE</span>
                    <span id="profileEmailDisplay" class="user-email">loading...</span>
                </div>
            </div>
        </div>
        <button class="settings-btn" onclick="openSettingsModal()">⚙️</button>
    </div>

    <div class="pay-cycle-card">
        <div class="pay-card-header">
            <span id="cycleLabel" class="cycle-title">PAY CYCLE</span>
            <span id="payDateBadge" class="pay-badge">Payday Pending</span>
        </div>
        
        <div class="pay-card-body">
            <div id="cycleEarnings" class="earnings-amount">0 <span class="currency">LKR</span></div>
        </div>

        <div class="pay-card-divider"></div>

        <div class="pay-card-footer">
            <div class="meta-item">
                <span class="meta-label">Shifts Tracked</span>
                <span id="shiftsCount" class="meta-value">0 Shifts</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">Active Cycle Period</span>
                <span id="cyclePeriodText" class="meta-value">--/--</span>
            </div>
        </div>
    </div>

    <div class="section-box">
        <div class="section-header">
            <h3 class="section-title">Log Shift</h3>
            <button class="date-picker-btn" onclick="openCalendarModal()">
                📅 <span id="shiftDateDisplay">08/05/2026</span>
            </button>
        </div>
        <div class="shift-list" id="availableShiftsContainer"></div>
    </div>

    <div class="section-box">
        <div class="section-header">
            <h3 class="section-title" id="historySectionTitle">August 2026 Records</h3>
            <div class="history-controls">
                <select class="history-select" id="historyMonthSelect" onchange="updateHistoryView()">
                    <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
                    <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
                    <option value="6">Jul</option><option value="7" selected>Aug</option><option value="8">Sep</option>
                    <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
                </select>
                <select class="history-select" id="historyYearSelect" onchange="updateHistoryView()">
                    <option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option>
                </select>
            </div>
        </div>
        <div class="history-list" id="recordsContainer"></div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ Settings & Options</h3>
                <button class="btn-close-modal" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="inputDisplayName" class="form-input">
            </div>
            <button class="btn-primary-block" onclick="saveProfileChanges()">Save Display Name</button>

            <!-- Admin Link: Dynamically turns visible when role === 'MANAGER' -->
            <a id="adminPanelLink" class="btn-modal-link" href="admin.html" style="display:none; background: #2e1065; border: 1px solid #7e22ce; color: #f3e8ff;">
                👑 Open Manager Admin Panel
            </a>

            <a class="btn-modal-link" href="setup.html">⚙️ Shift Presets & Request Manager Role</a>
            <button class="btn-modal-link" onclick="downloadCSVReport()">📥 Export CSV Report</button>
            <button class="btn-modal-link btn-reset" onclick="handleSignOut()">🚪 Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA93AnibNs8iaNwYuy1tJglGXXqeY6p2oo",
          authDomain: "shift-salary-tracker.firebaseapp.com",
          projectId: "shift-salary-tracker",
          storageBucket: "shift-salary-tracker.firebasestorage.app",
          messagingSenderId: "719444723616",
          appId: "1:719444723616:web:56b421b3d8d49f6b8946c5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        const defaultShifts = [
            { id: "shift_d", name: "Day Shift (D)", time: "7:00 AM – 6:00 PM", rate: 2000 },
            { id: "shift_e", name: "Evening Shift (E)", time: "6:00 PM – 11:30 PM", rate: 1800 },
            { id: "shift_m", name: "Mega Shift (M)", time: "6:00 PM – 3:00 AM", rate: 2700 },
            { id: "shift_de", name: "Double Shift (D + E)", time: "7:00 AM – 11:30 PM", rate: 3800 },
            { id: "shift_dm", name: "Full Day Double (D + M)", time: "7:00 AM – 3:00 AM next day", rate: 4700 }
        ];

        window.configuredShifts = JSON.parse(localStorage.getItem('shiftgrid_shifts')) || defaultShifts;
        window.userPayCycleConfig = JSON.parse(localStorage.getItem('shiftgrid_paycycle')) || { type: 'mid-month', payDay: 25 };

        function updateAccountUI(name, email, role, managerRequested) {
            const displayName = name || (email ? email.split('@')[0] : 'User');
            document.getElementById('profileNameDisplay').innerText = displayName;
            document.getElementById('inputDisplayName').value = displayName;
            document.getElementById('profileEmailDisplay').innerText = email || '';

            const badgeEl = document.getElementById('profileRoleBadge');
            const adminLinkEl = document.getElementById('adminPanelLink');

            // Explicit Priority logic
            if (role === "MANAGER") {
                badgeEl.innerText = "MANAGER";
                badgeEl.style.backgroundColor = "#6b21a8";
                badgeEl.style.color = "#f3e8ff";
                adminLinkEl.style.display = "flex";
            } else if (managerRequested) {
                badgeEl.innerText = "PENDING MANAGER";
                badgeEl.style.backgroundColor = "#854d0e";
                badgeEl.style.color = "#fef08a";
                adminLinkEl.style.display = "none";
            } else {
                badgeEl.innerText = role || "EMPLOYEE";
                badgeEl.style.backgroundColor = "#1e3a8a";
                badgeEl.style.color = "#93c5fd";
                adminLinkEl.style.display = "none";
            }

            const initials = displayName.substring(0,2).toUpperCase();
            document.getElementById('profileAvatarDisplay').innerText = initials;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;

                // Sync profile data to user doc to prevent "Unknown User" in Admin Panel
                setDoc(doc(db, "users", user.uid), {
                    displayName: user.displayName || user.email.split('@')[0],
                    email: user.email
                }, { merge: true });

                const userDocRef = doc(db, "users", user.uid);
                onSnapshot(userDocRef, (userDoc) => {
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        
                        if (data.shifts && data.shifts.length > 0) window.configuredShifts = data.shifts;
                        if (data.payCycleConfig) window.userPayCycleConfig = data.payCycleConfig;

                        const role = data.role || "EMPLOYEE";
                        const managerRequested = data.managerRoleRequested === true;

                        // Auto-unlock templates if role is elevated to MANAGER
                        if (role === "MANAGER") {
                            window.templateRequested = false;
                        } else {
                            window.templateRequested = data.templateRequested === true;
                        }

                        updateAccountUI(data.displayName || user.displayName, user.email, role, managerRequested);
                        window.renderAvailableShifts();
                        window.updateHistoryView();
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        window.handleSignOut = function() {
            signOut(auth).then(() => { window.location.href = "index.html"; });
        };

        window.saveProfileChanges = async function() {
            const newName = document.getElementById('inputDisplayName').value;
            if (newName && currentUser) {
                await setDoc(doc(db, "users", currentUser.uid), { displayName: newName }, { merge: true });
                closeSettingsModal();
            }
        };
    </script>

    <script>
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let selectedLogDate = new Date(2026, 7, 5);
        let shiftRecords = JSON.parse(localStorage.getItem('shiftgrid_records')) || [];

        function renderAvailableShifts() {
            const container = document.getElementById('availableShiftsContainer');
            if (!container) return;
            container.innerHTML = '';

            if (window.templateRequested) {
                container.innerHTML = `
                    <div style="background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.3); border-radius: 16px; padding: 18px; text-align: center; color: #93c5fd; font-size: 13px;">
                        ⏳ <strong>Official Shift Template Pending Admin Approval</strong><br>
                        <span style="font-size: 11px; color: var(--text-muted); margin-top: 6px; display: block;">Shift options are hidden during the pending review period.</span>
                    </div>
                `;
                return;
            }

            (window.configuredShifts || []).forEach(s => {
                const currentRate = s.rate !== undefined ? s.rate : 0;
                container.innerHTML += `
                    <div class="shift-item">
                        <div class="shift-info">
                            <h4>${s.name}</h4>
                            <p>${s.time || ''} • LKR ${currentRate.toLocaleString()}</p>
                        </div>
                        <button class="btn-log" onclick="logShift('${s.name}', ${currentRate})">+ Log</button>
                    </div>
                `;
            });
        }

        function updateHistoryView() {
            const selMonth = parseInt(document.getElementById('historyMonthSelect').value);
            const selYear = parseInt(document.getElementById('historyYearSelect').value);
            document.getElementById('historySectionTitle').innerText = `${monthNames[selMonth]} ${selYear} Records`;

            const filtered = shiftRecords.filter(rec => {
                const recDate = new Date(rec.date);
                return recDate.getFullYear() === selYear && recDate.getMonth() === selMonth;
            });

            const container = document.getElementById('recordsContainer');
            container.innerHTML = '';
            let total = 0;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">No shift attendance logged for this month.</div>`;
            } else {
                filtered.forEach(rec => {
                    total += rec.amount;
                    container.insertAdjacentHTML('afterbegin', `
                        <div class="history-item">
                            <div>
                                <div class="history-title">${rec.title}</div>
                                <div class="history-date">${rec.date}</div>
                            </div>
                            <div class="history-right">
                                <span class="history-price">${rec.amount.toLocaleString()} LKR</span>
                                <button class="btn-delete" onclick="deleteRecord('${rec.id}')">✕</button>
                            </div>
                        </div>
                    `);
                });
            }

            document.getElementById('cycleEarnings').innerHTML = `${total.toLocaleString()} <span class="currency">LKR</span>`;
            document.getElementById('shiftsCount').innerText = `${filtered.length} Shifts`;
        }

        function logShift(title, amount) {
            const y = selectedLogDate.getFullYear();
            const m = String(selectedLogDate.getMonth() + 1).padStart(2, '0');
            const d = String(selectedLogDate.getDate()).padStart(2, '0');
            shiftRecords.push({ id: 'rec-' + Date.now(), title, amount, date: `${y}-${m}-${d}` });
            localStorage.setItem('shiftgrid_records', JSON.stringify(shiftRecords));
            updateHistoryView();
        }

        function deleteRecord(id) {
            shiftRecords = shiftRecords.filter(r => r.id !== id);
            localStorage.setItem('shiftgrid_records', JSON.stringify(shiftRecords));
            updateHistoryView();
        }

        function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }

        document.addEventListener('DOMContentLoaded', () => {
            renderAvailableShifts();
            updateHistoryView();
        });
    </script>
</body>
</html>
