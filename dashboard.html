<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid — Dashboard</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0a0f0d;
            --surface: #121a16;
            --surface-border: #1e2c24;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-muted: #8b9d93;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --accent-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 15px;
            z-index: 9999;
        }

        /* Navbar */
        header.nav-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-brand img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: contain;
        }

        .nav-brand h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .user-email {
            font-size: 13px;
            font-weight: 600;
        }

        .user-badge {
            font-size: 11px;
            color: var(--primary-blue);
            text-transform: capitalize;
            background: rgba(37, 99, 235, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 2px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            color: var(--error-color);
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 340px 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Overview Stat Cards */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-box {
            background: var(--bg-base);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-value.highlight {
            color: var(--success-color);
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            background: var(--bg-base);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 11px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-blue);
        }

        .btn-primary {
            width: 100%;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-blue-hover);
        }

        /* Shift Log List */
        .logs-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
        }

        .log-item {
            background: var(--bg-base);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .log-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .log-shift-name {
            font-size: 14px;
            font-weight: 700;
        }

        .log-pay {
            font-size: 14px;
            font-weight: 700;
            color: var(--success-color);
        }

        .btn-delete-log {
            background: none;
            border: none;
            color: var(--error-color);
            cursor: pointer;
            font-size: 12px;
            margin-left: 12px;
        }

        .empty-logs {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 30px 10px;
        }

        .status-message {
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
        .status-message.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Global Loading Guard -->
    <div id="loadingScreen" class="loading-screen">
        <p>Loading your ShiftGrid workspace...</p>
    </div>

    <!-- Navigation Header -->
    <header class="nav-header">
        <div class="nav-brand">
            <img src="SiftGrid logo.png" alt="ShiftGrid Logo">
            <h2>ShiftGrid</h2>
        </div>
        <div class="user-profile">
            <div class="user-meta">
                <span class="user-email" id="displayEmail">user@example.com</span>
                <span class="user-badge" id="displayRole">Employee</span>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
        </div>
    </header>

    <!-- Main Workspace Grid -->
    <div class="dashboard-grid">
        
        <!-- Left Sidebar: Log Shift & Overview -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Summary Stats -->
            <div class="stats-summary">
                <div class="stat-box">
                    <span class="stat-label">Total Earnings</span>
                    <span class="stat-value highlight" id="statEarnings">0 LKR</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Shifts Logged</span>
                    <span class="stat-value" id="statShiftCount">0</span>
                </div>
            </div>

            <!-- Log Shift Form -->
            <div class="card">
                <div class="card-title">Log New Shift</div>
                
                <div id="statusAlert" class="status-message"></div>

                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="logDate">
                </div>

                <div class="input-group">
                    <label>Select Shift Type</label>
                    <select id="selectShift" onchange="handleShiftSelectChange()">
                        <!-- Dynamic options loaded from user config -->
                    </select>
                </div>

                <div class="input-group">
                    <label>Calculated Pay (LKR)</label>
                    <input type="number" id="logRate" placeholder="e.g. 2000">
                </div>

                <button class="btn-primary" onclick="submitShiftLog()">Record Shift</button>
            </div>

        </div>

        <!-- Right Main Panel: Shift Logs History -->
        <div class="card">
            <div class="card-title">
                <span>Recent Shift Logs</span>
                <button class="btn-logout" style="font-size: 11px;" onclick="loadUserLogs()">Refresh</button>
            </div>

            <div class="logs-container" id="logsContainer">
                <div class="empty-logs">No shifts recorded yet for this period.</div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA93AnibNs8iaNwYuy1tJglGXXqeY6p2oo",
          authDomain: "shift-salary-tracker.firebaseapp.com",
          projectId: "shift-salary-tracker",
          storageBucket: "shift-salary-tracker.firebasestorage.app",
          messagingSenderId: "719444723616",
          appId: "1:719444723616:web:56b421b3d8d49f6b8946c5",
          measurementId: "G-V8V657F1S0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let configuredShifts = [];
        let shiftLogs = [];

        // Initialize Today's Date in picker
        document.getElementById('logDate').valueAsDate = new Date();

        // Central Auth & Setup Guard
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('displayEmail').innerText = user.email;

                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);

                    if (!userDoc.exists() || !userDoc.data().shiftsConfigured) {
                        // Redirect to setup if incomplete
                        window.location.href = "setup.html";
                        return;
                    }

                    const userData = userDoc.data();
                    configuredShifts = userData.shifts || JSON.parse(localStorage.getItem('shiftgrid_shifts') || '[]');
                    
                    if (userData.role) {
                        document.getElementById('displayRole').innerText = userData.role;
                    }

                    populateShiftDropdown();
                    await loadUserLogs();

                    document.getElementById('loadingScreen').style.display = 'none';
                } catch (e) {
                    console.error("Dashboard init error:", e);
                    document.getElementById('loadingScreen').style.display = 'none';
                }
            } else {
                // Redirect unauthenticated user to auth portal
                window.location.href = "index.html";
            }
        });

        function populateShiftDropdown() {
            const select = document.getElementById('selectShift');
            select.innerHTML = '';

            if (configuredShifts.length === 0) {
                select.innerHTML = `<option value="">No shifts available</option>`;
                return;
            }

            configuredShifts.forEach((s, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `${s.name} (${s.time || ''})`;
                select.appendChild(option);
            });

            handleShiftSelectChange();
        }

        window.handleShiftSelectChange = function() {
            const select = document.getElementById('selectShift');
            const selectedIdx = select.value;
            if (selectedIdx === '' || !configuredShifts[selectedIdx]) return;

            const shift = configuredShifts[selectedIdx];
            const dateVal = document.getElementById('logDate').value;
            const logDate = dateVal ? new Date(dateVal) : new Date();
            const isSaturday = logDate.getDay() === 6;

            // Check Saturday Rate vs Normal Rate
            let rateToApply = shift.rate;
            if (shift.normal !== undefined) {
                rateToApply = (isSaturday && shift.saturday) ? shift.saturday : shift.normal;
            }

            document.getElementById('logRate').value = rateToApply || 0;
        };

        // Recalculate rate if user changes date to/from Saturday
        document.getElementById('logDate').addEventListener('change', window.handleShiftSelectChange);

        window.submitShiftLog = async function() {
            if (!currentUser) return;

            const dateVal = document.getElementById('logDate').value;
            const selectIdx = document.getElementById('selectShift').value;
            const rateVal = parseFloat(document.getElementById('logRate').value);

            if (!dateVal || selectIdx === '' || isNaN(rateVal)) {
                showAlert("Please complete all log fields correctly.", "error");
                return;
            }

            const chosenShift = configuredShifts[selectIdx];

            try {
                const logData = {
                    date: dateVal,
                    shiftId: chosenShift.id || 'custom',
                    shiftName: chosenShift.name,
                    rate: rateVal,
                    createdAt: new Date().toISOString()
                };

                const logsRef = collection(db, "users", currentUser.uid, "shiftLogs");
                await addDoc(logsRef, logData);

                showAlert("Shift logged successfully!", "success");
                await loadUserLogs();
            } catch (e) {
                showAlert("Failed to log shift: " + e.message, "error");
            }
        };

        window.loadUserLogs = async function() {
            if (!currentUser) return;
            const logsContainer = document.getElementById('logsContainer');

            try {
                const logsRef = collection(db, "users", currentUser.uid, "shiftLogs");
                const q = query(logsRef, orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);

                shiftLogs = [];
                querySnapshot.forEach((docSnap) => {
                    shiftLogs.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderLogsUI();
            } catch (e) {
                console.error("Error loading logs:", e);
                // Fallback for missing index
                const logsRef = collection(db, "users", currentUser.uid, "shiftLogs");
                const querySnapshot = await getDocs(logsRef);
                shiftLogs = [];
                querySnapshot.forEach((docSnap) => {
                    shiftLogs.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderLogsUI();
            }
        };

        function renderLogsUI() {
            const logsContainer = document.getElementById('logsContainer');
            let totalEarnings = 0;

            if (shiftLogs.length === 0) {
                logsContainer.innerHTML = `<div class="empty-logs">No shifts recorded yet for this period.</div>`;
                document.getElementById('statEarnings').innerText = "0 LKR";
                document.getElementById('statShiftCount').innerText = "0";
                return;
            }

            logsContainer.innerHTML = '';
            shiftLogs.forEach((log) => {
                totalEarnings += (log.rate || 0);
                
                logsContainer.innerHTML += `
                    <div class="log-item">
                        <div class="log-info">
                            <span class="log-shift-name">${log.shiftName}</span>
                            <span class="log-date">${log.date}</span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="log-pay">${log.rate} LKR</span>
                            <button class="btn-delete-log" onclick="deleteLog('${log.id}')">✕</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('statEarnings').innerText = `${totalEarnings.toLocaleString()} LKR`;
            document.getElementById('statShiftCount').innerText = shiftLogs.length;
        }

        window.deleteLog = async function(logId) {
            if (!currentUser || !confirm("Are you sure you want to delete this log entry?")) return;
            try {
                const docRef = doc(db, "users", currentUser.uid, "shiftLogs", logId);
                await deleteDoc(docRef);
                await loadUserLogs();
            } catch (e) {
                showAlert("Error deleting log: " + e.message, "error");
            }
        };

        window.handleLogout = async function() {
            try {
                await signOut(auth);
                localStorage.clear();
                window.location.href = "index.html";
            } catch (e) {
                console.error("Logout error:", e);
            }
        };

        function showAlert(message, type) {
            const alertBox = document.getElementById('statusAlert');
            if (!message) {
                alertBox.style.display = 'none';
                return;
            }
            alertBox.className = `status-message ${type}`;
            alertBox.innerText = message;
        }
    </script>
</body>
</html>
