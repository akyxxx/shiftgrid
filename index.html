<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid — Mobile Shift & Salary Tracker</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Dark Teal Theme Palette derived from logo */
            --bg-base: #0a0f0d;
            --surface: #121a16;
            --surface-border: #1e2c24;
            --primary-blue: #0066ff;
            --primary-purple: #6600ff;
            --accent-gradient: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-purple) 100%);
            --accent-hover: #5500dd; /* Slightly darker purple for hover */
            --text-main: #ffffff;
            --text-muted: #8b9d93;
            --error: #ff5c5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Styling */
        .logo-container {
            margin-bottom: 32px;
            text-align: center;
        }

        .logo-img {
            width: 110px; /* Adjusted size */
            height: auto;
            margin-bottom: 16px;
        }

        .logo-tagline {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .welcome-header {
            text-align: center;
            margin-bottom: 36px;
            width: 100%;
        }

        .welcome-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-header p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            width: 100%;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            background: var(--bg-base);
            border: 2px solid var(--surface-border); /* Thicker border */
            border-radius: 12px;
            padding: 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        /* Focus state uses gradient border logic via box-shadow */
        .form-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 32px;
            width: 100%;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-blue);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 102, 255, 0.3);
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 24px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:active {
            transform: scale(0.99); /* Subtle click effect */
        }

        .auth-footer {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            width: 100%;
            margin-top: auto; /* Pushes to bottom of card if needed */
        }

        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px;
            }
            .welcome-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Brand Logo Header -->
        <div class="logo-container">
            <img src="SiftGrid logo.png" alt="ShiftGrid Logo" class="logo-img">
            <div class="logo-tagline">Attendance • Salary • People • Insights</div>
        </div>

        <div class="welcome-header">
            <h1>Welcome Back!</h1>
            <p>Sign in to manage attendance, track salaries, and gain workforce insights.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Email address</label>
                <input type="email" class="form-input" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Sign in</button>
        </form>

        <div class="auth-footer">
            Don’t have an account? <a href="#">Contact your administrator</a>
        </div>
    </div>

    <script>
        // Placeholder function for form submission handling
        function handleLogin(event) {
            event.preventDefault();
            // Add your Firebase Auth logic here
            alert("Sign-in attempt processed. Redirecting to dashboard...");
        }
    </script>
</body>
</html>
