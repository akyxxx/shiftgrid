<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid — Portal</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0a0f0d;
            --surface: #121a16;
            --surface-border: #1e2c24;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-muted: #8b9d93;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Loading Screen */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Auth Card View */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 16px;
        }

        .welcome-header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .welcome-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-header p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input {
            background: var(--bg-base);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
        }

        .forgot-password-row {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-top: -8px;
        }

        .forgot-password-link {
            font-size: 12px;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .btn-primary:hover {
            background: var(--primary-blue-hover);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            width: 100%;
            margin: 16px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--surface-border);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .btn-google {
            width: 100%;
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .status-message {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
        .status-message.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Step 1: Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <p>Connecting to ShiftGrid...</p>
    </div>

    <!-- Step 1: Auth View (Shows when logged out) -->
    <div id="authView" class="auth-card">
        <div class="logo-container">
            <img src="SiftGrid logo.png" alt="ShiftGrid Logo" class="logo-img">
        </div>

        <div class="welcome-header">
            <h1>Welcome Back</h1>
            <p>Sign in to manage your shifts and schedule.</p>
        </div>

        <div id="statusAlert" class="status-message"></div>

        <form class="auth-form" id="loginForm" onsubmit="handleEmailLogin(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="name@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <div class="forgot-password-row">
                <a class="forgot-password-link" onclick="handleForgotPassword()">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="divider">or</div>

        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.08-1.82 2.72v2.26h2.94c1.72-1.58 2.72-3.9 2.72-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.85.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.5 0 9s.35 2.85.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
            Sign in with Google
        </button>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA93AnibNs8iaNwYuy1tJglGXXqeY6p2oo",
          authDomain: "shift-salary-tracker.firebaseapp.com",
          projectId: "shift-salary-tracker",
          storageBucket: "shift-salary-tracker.firebasestorage.app",
          messagingSenderId: "719444723616",
          appId: "1:719444723616:web:56b421b3d8d49f6b8946c5",
          measurementId: "G-V8V657F1S0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Sequential Navigation: Logged in -> Go to setup.html
        onAuthStateChanged(auth, (user) => {
            const loadingScreen = document.getElementById('loadingScreen');
            const authView = document.getElementById('authView');

            if (user) {
                // Next Step in Flow: Redirect to setup.html
                window.location.href = "setup.html";
            } else {
                // Not logged in: Render Auth Form
                loadingScreen.style.display = 'none';
                authView.style.display = 'flex';
            }
        });

        window.handleEmailLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "setup.html";
            } catch (error) {
                showAlert(error.message, "error");
            }
        };

        window.handleGoogleLogin = async function() {
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = "setup.html";
            } catch (error) {
                showAlert(error.message, "error");
            }
        };

        window.handleForgotPassword = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showAlert("Please enter your email address above first.", "error");
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showAlert("Password reset link sent to your email!", "success");
            } catch (error) {
                showAlert(error.message, "error");
            }
        };

        function showAlert(message, type) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.className = `status-message ${type}`;
            alertBox.innerText = message;
        }
    </script>
</body>
</html>
