<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid — Login & Management</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0a0f0d;
            --surface: #121a16;
            --surface-border: #1e2c24;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --text-main: #ffffff;
            --text-muted: #8b9d93;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 20px;
        }

        .welcome-header {
            margin-bottom: 24px;
            width: 100%;
        }

        .welcome-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .form-group {
            width: 100%;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-blue);
        }

        .btn-primary {
            width: 100%;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-blue-hover);
        }

        .toggle-mode {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toggle-mode span {
            color: var(--primary-blue);
            cursor: pointer;
            font-weight: 600;
        }

        .status-message {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
        .status-message.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }

        #appWorkspace {
            display: none;
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Authentication Card -->
    <div class="auth-card" id="authCard">
        <div class="logo-container">
            <img src="SiftGrid logo.png" alt="ShiftGrid Logo" class="logo-img">
        </div>

        <div class="welcome-header">
            <h1 id="formTitle">Welcome Back</h1>
            <p id="formSubtitle">Sign in to manage your shifts and schedule.</p>
        </div>

        <div id="statusAlert" class="status-message"></div>

        <form id="authForm" onsubmit="handleAuth(event)" style="width: 100%;">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" class="form-input" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
        </form>

        <div class="toggle-mode" id="toggleText">
            Don't have an account? <span onclick="toggleMode()">Sign Up</span>
        </div>
    </div>

    <!-- App Workspace (Shown after successful login and approval) -->
    <div id="appWorkspace">
        <h1>ShiftGrid Workspace</h1>
        <p id="userRoleDisplay" style="color: var(--text-muted); margin: 15px 0;"></p>
        <button onclick="handleLogout()" class="btn-primary" style="background: var(--error-color);">Sign Out</button>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA93AnibNs8iaNwYuy1tJglGXXqeY6p2oo",
          authDomain: "shift-salary-tracker.firebaseapp.com",
          projectId: "shift-salary-tracker",
          storageBucket: "shift-salary-tracker.firebasestorage.app",
          messagingSenderId: "719444723616",
          appId: "1:719444723616:web:56b421b3d8d49f6b8946c5",
          measurementId: "G-V8V657F1S0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUp = false;

        window.toggleMode = function() {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerText = isSignUp ? "Create Account" : "Welcome Back";
            document.getElementById('formSubtitle').innerText = isSignUp ? "Register to start using ShiftGrid." : "Sign in to manage your shifts and schedule.";
            document.getElementById('submitBtn').innerText = isSignUp ? "Sign Up" : "Sign In";
            document.getElementById('toggleText').innerHTML = isSignUp 
                ? `Already have an account? <span onclick="toggleMode()">Sign In</span>` 
                : `Don't have an account? <span onclick="toggleMode()">Sign Up</span>`;
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    // New user goes to setup to pick a role
                    window.location.href = "setup.html";
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                showAlert(error.message, "error");
            }
        }

        window.handleLogout = function() {
            signOut(auth).then(() => {
                window.location.reload();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);

                    if (!userDoc.exists() || !userDoc.data().role) {
                        // If user doesn't have a role configured, redirect to setup
                        window.location.href = "setup.html";
                    } else if (userDoc.data().role === 'pending_manager') {
                        showAlert("Your Manager request is pending admin approval.", "error");
                        await signOut(auth);
                    } else {
                        // Authorized user, show workspace
                        document.getElementById('authCard').style.display = 'none';
                        document.getElementById('appWorkspace').style.display = 'block';
                        document.getElementById('userRoleDisplay').innerText = `Logged in as: ${user.email} (${userDoc.data().role.toUpperCase()})`;
                    }
                } catch (err) {
                    console.error(err);
                }
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.className = `status-message ${type}`;
            alertBox.innerText = message;
        }
    </script>
</body>
</html>
