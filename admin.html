<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & Staff Portal - Shift & Salary Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --warning-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Lock Screen */
        .auth-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .auth-card h2 {
            margin-bottom: 8px;
            font-size: 1.4rem;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Header Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .role-tag {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-logout:hover {
            border-color: var(--danger-red);
            color: var(--danger-red);
        }

        /* Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .metric-card .val {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 4px;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Cards */
        .requests-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .request-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .user-info h3 {
            font-size: 1rem;
            word-break: break-all;
        }

        .user-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning-orange); }
        .status-approved { background: rgba(16, 185, 129, 0.2); color: var(--success-green); }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger-red); }

        .config-details {
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
        }

        .shifts-summary {
            margin-top: 6px;
        }

        .shift-tag {
            display: inline-block;
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 4px;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-approve { background: var(--success-green); color: #fff; }
        .btn-reject { background: var(--danger-red); color: #fff; }

        .restricted-notice {
            margin-top: 12px;
            padding: 8px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Access Lock Screen -->
    <div id="lockScreen" class="auth-overlay">
        <div class="auth-card">
            <h2 id="lockTitle">🔒 Restricted Access</h2>
            <p id="lockMessage">Checking credentials and administrator privileges...</p>
        </div>
    </div>

    <!-- Main Admin Panel -->
    <div id="adminPanel" class="container hidden">
        <div class="header">
            <div>
                <h1>Admin Portal</h1>
                <p>Manage staff requests & user permissions</p>
            </div>
            <div class="user-badge">
                <span id="userRoleBadge" class="role-tag">STAFF</span>
                <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div style="color: var(--warning-orange); font-size: 0.8rem;">Pending</div>
                <div class="val" id="valPending">0</div>
            </div>
            <div class="metric-card">
                <div style="color: var(--success-green); font-size: 0.8rem;">Approved</div>
                <div class="val" id="valApproved">0</div>
            </div>
            <div class="metric-card">
                <div style="color: var(--accent-blue); font-size: 0.8rem;">Total</div>
                <div class="val" id="valTotal">0</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by email or UID...">
            <div class="tabs">
                <button class="tab-btn active" onclick="setTab('pending', this)">Pending</button>
                <button class="tab-btn" onclick="setTab('approved', this)">Approved</button>
                <button class="tab-btn" onclick="setTab('rejected', this)">Rejected</button>
                <button class="tab-btn" onclick="setTab('all', this)">All Requests</button>
            </div>
        </div>

        <div id="requestsContainer" class="requests-list">
            <div class="empty-state">Loading user requests...</div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA93AnibNs8iaNwYuy1tJglGXXqeY6p2oo",
          authDomain: "shift-salary-tracker.firebaseapp.com",
          projectId: "shift-salary-tracker",
          storageBucket: "shift-salary-tracker.firebasestorage.app",
          messagingSenderId: "719444723616",
          appId: "1:719444723616:web:56b421b3d8d49f6b8946c5",
          measurementId: "G-V8V657F1S0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Super Admin Whitelist
        const ALLOWED_EMAILS = [
            "tharaka1998.me@gmail.com"
        ];

        let allRequests = [];
        let currentTab = 'pending';
        let unsubscribeRequests = null;
        let isSuperAdminOrAdmin = false; // Tracks if logged-in user is Admin vs Manager

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Authenticate & Verify Permissions
        onAuthStateChanged(auth, async (user) => {
            const lockScreen = document.getElementById('lockScreen');
            const adminPanel = document.getElementById('adminPanel');
            const lockTitle = document.getElementById('lockTitle');
            const lockMessage = document.getElementById('lockMessage');

            if (!user) {
                if (unsubscribeRequests) unsubscribeRequests();
                adminPanel.classList.add('hidden');
                lockScreen.classList.remove('hidden');
                lockTitle.innerText = "🔒 Authentication Required";
                lockMessage.innerText = "Please log in to your account to access the admin portal.";
                return;
            }

            try {
                const userEmail = (user.email || '').toLowerCase().trim();
                const isWhitelisted = ALLOWED_EMAILS.map(e => e.toLowerCase().trim()).includes(userEmail);

                let userRole = 'USER';
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    userRole = (userSnap.data().role || '').toUpperCase();
                }

                // Check Admin privileges vs Manager privileges
                isSuperAdminOrAdmin = isWhitelisted || userRole === 'ADMIN';
                const isManager = userRole === 'MANAGER';

                if (isSuperAdminOrAdmin || isManager) {
                    // Access Granted
                    lockScreen.classList.add('hidden');
                    adminPanel.classList.remove('hidden');
                    
                    const badgeText = isSuperAdminOrAdmin ? (isWhitelisted ? 'SUPER ADMIN' : 'ADMIN') : 'MANAGER';
                    document.getElementById('userRoleBadge').innerText = badgeText;

                    initRealtimeRequests();
                } else {
                    // Access Denied
                    if (unsubscribeRequests) unsubscribeRequests();
                    adminPanel.classList.add('hidden');
                    lockScreen.classList.remove('hidden');
                    lockTitle.innerText = "🚫 Access Restricted";
                    lockMessage.innerText = `Account logged in as (${user.email}), but does not have Manager or Admin permissions.`;
                }
            } catch (err) {
                console.error("Authorization check error:", err);
                adminPanel.classList.add('hidden');
                lockScreen.classList.remove('hidden');
                lockTitle.innerText = "⚠️ Permission Error";
                lockMessage.innerText = "Error verifying user access permissions.";
            }
        });

        function initRealtimeRequests() {
            if (unsubscribeRequests) unsubscribeRequests();

            unsubscribeRequests = onSnapshot(collection(db, "requests"), (snapshot) => {
                allRequests = [];
                snapshot.forEach((docSnap) => {
                    allRequests.push({ id: docSnap.id, ...docSnap.data() });
                });
                updateMetrics();
                renderRequests();
            }, (error) => {
                console.error("Firestore error loading requests:", error);
                const container = document.getElementById('requestsContainer');
                if (container) {
                    container.innerHTML = `<div class="empty-state" style="color: var(--danger-red);">Error loading requests. Check Firestore security rules.</div>`;
                }
            });
        }

        function updateMetrics() {
            const pending = allRequests.filter(r => (r.status || 'pending') === 'pending').length;
            const approved = allRequests.filter(r => r.status === 'approved').length;
            
            document.getElementById('valPending').innerText = pending;
            document.getElementById('valApproved').innerText = approved;
            document.getElementById('valTotal').innerText = allRequests.length;
        }

        window.setTab = function(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');
            renderRequests();
        };

        window.renderRequests = function() {
            const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            const container = document.getElementById('requestsContainer');
            if (!container) return;
            
            let filtered = allRequests.filter(req => {
                const matchesTab = currentTab === 'all' || (req.status || 'pending') === currentTab;
                const matchesSearch = !searchTerm || 
                    (req.email && req.email.toLowerCase().includes(searchTerm)) ||
                    (req.uid && req.uid.toLowerCase().includes(searchTerm));
                return matchesTab && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">No ${currentTab !== 'all' ? currentTab : ''} requests found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(req => {
                const status = req.status || 'pending';
                const statusClass = `status-${status}`;
                const shifts = Array.isArray(req.shifts) ? req.shifts : [];
                
                const email = escapeHtml(req.email || 'Unknown User');
                const uid = escapeHtml(req.uid || req.id);
                const requestType = req.requestType || 'template_access';
                const roleContext = escapeHtml(req.roleContext || req.requestedRole || 'Employee');

                // Check if current user can manage this specific request type
                const isManagerRequest = requestType === 'manager_role';
                const canManageThisRequest = isSuperAdminOrAdmin || (!isManagerRequest && requestType === 'template_access');

                return `
                    <div class="request-card" id="req-${escapeHtml(req.id)}">
                        <div class="card-header">
                            <div class="user-info">
                                <h3>${email}</h3>
                                <p>UID: ${uid} • Type: ${escapeHtml(requestType)}</p>
                            </div>
                            <span class="status-badge ${statusClass}">${escapeHtml(status)}</span>
                        </div>
                        <div class="config-details">
                            <div class="config-row">
                                <span>Requested Role / Context:</span>
                                <strong>${roleContext}</strong>
                            </div>
                            ${shifts.length > 0 ? `
                                <div class="shifts-summary">
                                    <div style="color: var(--text-muted); font-size:0.75rem; margin-bottom:4px;">Configured Shift Presets:</div>
                                    ${shifts.map(s => `<span class="shift-tag">${escapeHtml(s.name)} (${escapeHtml(s.rate)} LKR)</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                        ${status === 'pending' ? (
                            canManageThisRequest ? `
                                <div class="card-actions">
                                    <button class="btn-action btn-approve" onclick="updateRequestStatus('${escapeHtml(req.id)}', '${escapeHtml(req.uid || '')}', 'approved', '${escapeHtml(requestType)}')">Approve</button>
                                    <button class="btn-action btn-reject" onclick="updateRequestStatus('${escapeHtml(req.id)}', '${escapeHtml(req.uid || '')}', 'rejected', '${escapeHtml(requestType)}')">Reject</button>
                                </div>
                            ` : `
                                <div class="restricted-notice">
                                    🔒 Manager Role requests can only be approved by Admin
                                </div>
                            `
                        ) : ''}
                    </div>
                `;
            }).join('');
        };

        window.updateRequestStatus = async function(requestId, userId, newStatus, requestType) {
            try {
                if (!requestId) return;

                // Security Check: Manager cannot approve manager_role requests
                if (requestType === 'manager_role' && !isSuperAdminOrAdmin) {
                    alert("Permission Denied: Managers cannot accept or reject Manager Role requests.");
                    return;
                }

                // Update ticket status
                await updateDoc(doc(db, "requests", requestId), {
                    status: newStatus,
                    updatedAt: new Date().toISOString()
                });

                // Update user document permissions if approved
                if (userId && userId !== 'undefined' && userId !== '') {
                    const userUpdate = {};
                    if (requestType === 'manager_role' && newStatus === 'approved') {
                        userUpdate.role = 'MANAGER';
                        userUpdate.managerStatus = 'approved';
                        userUpdate.managerRoleRequested = false;
                    } else if (requestType === 'template_access' && newStatus === 'approved') {
                        userUpdate.templateRequested = false;
                        userUpdate.templateApproved = true;
                    }
                    if (Object.keys(userUpdate).length > 0) {
                        await setDoc(doc(db, "users", userId), userUpdate, { merge: true });
                    }
                }
            } catch (err) {
                console.error("Error updating request status:", err);
                alert("Failed to update status: " + err.message);
            }
        };

        window.handleLogout = async function() {
            try {
                await signOut(auth);
            } catch (err) {
                console.error("Logout error:", err);
            }
        };

        document.getElementById('searchInput')?.addEventListener('input', renderRequests);
    </script>
</body>
</html>
