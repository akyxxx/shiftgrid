<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftGrid — Admin Panel</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --card-bg: #0e1622;
            --card-inner: #141f2e;
            --card-border: #1a2636;
            --primary-blue: #2563eb;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; max-width: 480px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #141f2e; border: 1px solid var(--card-border); color: #fff; padding: 8px 14px; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 600; }

        .stats-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; text-align: center; }
        .stat-value { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

        .ticket-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .ticket-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .user-name { font-size: 16px; font-weight: 700; color: #fff; }
        .user-email { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .badge-pending { background: rgba(217, 119, 6, 0.2); color: #fef08a; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }

        .details-box { background: var(--card-inner); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: var(--text-muted); }
        .detail-value { font-weight: 700; color: #fff; }

        .action-btns { display: flex; gap: 10px; }
        .btn-approve { flex: 1; background: var(--primary-blue); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-reject { flex: 1; background: #2a1215; color: #f87171; border: 1px solid #7f1d1d; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>👑 Admin Approval Panel</h2>
        <a href="dashboard.html" class="back-btn">← Dashboard</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div id="countPending" class="stat-value" style="color: #f59e0b;">0</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
            <div id="countApproved" class="stat-value" style="color: #22c55e;">0</div>
            <div class="stat-label">Approved</div>
        </div>
        <div class="stat-card">
            <div id="countTotal" class="stat-value" style="color: #60a5fa;">0</div>
            <div class="stat-label">Total Tickets</div>
        </div>
    </div>

    <div id="ticketsList">
        <div style="text-align:center; color: var(--text-muted); padding: 40px 0;">Loading tickets...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA93AnibNs8iaNwYuy1tJglGXXqeY6p2oo",
          authDomain: "shift-salary-tracker.firebaseapp.com",
          projectId: "shift-salary-tracker",
          storageBucket: "shift-salary-tracker.firebasestorage.app",
          messagingSenderId: "719444723616",
          appId: "1:719444723616:web:56b421b3d8d49f6b8946c5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Realtime listener for tickets
        onSnapshot(collection(db, "tickets"), (snapshot) => {
            const container = document.getElementById('ticketsList');
            container.innerHTML = '';

            let pendingCount = 0;
            let approvedCount = 0;
            let totalCount = snapshot.size;

            if (snapshot.empty) {
                container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 40px 0;">No tickets found.</div>`;
            }

            snapshot.forEach((ticketDoc) => {
                const t = ticketDoc.data();
                const ticketId = ticketDoc.id;

                if (t.status === "PENDING") pendingCount++;
                if (t.status === "APPROVED") approvedCount++;

                // Render only PENDING tickets in actionable area
                if (t.status === "PENDING") {
                    const name = t.userName || t.displayName || "Unknown User";
                    const email = t.userEmail || t.email || "No Email Registered";
                    const roleReq = t.requestedRole || "MANAGER";

                    container.innerHTML += `
                        <div class="ticket-card">
                            <div class="ticket-header">
                                <div>
                                    <div class="user-name">${name}</div>
                                    <div class="user-email">${email}</div>
                                </div>
                                <span class="badge-pending">PENDING</span>
                            </div>

                            <div class="details-box">
                                <div class="detail-row">
                                    <span class="detail-label">Requested Role:</span>
                                    <span class="detail-value" style="color: #c084fc;">${roleReq}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Pay Cycle Model:</span>
                                    <span class="detail-value">${t.payCycleModel || "Mid-Month Cycle"}</span>
                                </div>
                            </div>

                            <div class="action-btns">
                                <button class="btn-approve" onclick="approveTicket('${ticketId}', '${t.userId}', '${roleReq}', ${JSON.stringify(t.shifts || []).replace(/"/g, '&quot;')})">✓ Approve & Unlock</button>
                                <button class="btn-reject" onclick="rejectTicket('${ticketId}', '${t.userId}')">✕ Reject</button>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('countPending').innerText = pendingCount;
            document.getElementById('countApproved').innerText = approvedCount;
            document.getElementById('countTotal').innerText = totalCount;

            if (pendingCount === 0 && !snapshot.empty) {
                container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 40px 0;">All requests have been processed! 🎉</div>`;
            }
        });

        // Approve Function: Sets user role directly to MANAGER and clears locks
        window.approveTicket = async function(ticketId, userId, requestedRole, shifts) {
            try {
                // 1. Update Ticket Status
                await setDoc(doc(db, "tickets", ticketId), { status: "APPROVED" }, { merge: true });

                // 2. Upgrade User Document Role
                await setDoc(doc(db, "users", userId), {
                    role: requestedRole || "MANAGER",
                    managerRoleRequested: false,
                    templateRequested: false,
                    shifts: shifts
                }, { merge: true });

                alert("Request approved! User role updated to " + (requestedRole || "MANAGER"));
            } catch (err) {
                console.error("Approval error:", err);
                alert("Approval failed: " + err.message);
            }
        };

        // Reject Function
        window.rejectTicket = async function(ticketId, userId) {
            try {
                await setDoc(doc(db, "tickets", ticketId), { status: "REJECTED" }, { merge: true });
                await setDoc(doc(db, "users", userId), {
                    managerRoleRequested: false,
                    templateRequested: false
                }, { merge: true });

                alert("Request rejected.");
            } catch (err) {
                console.error("Rejection error:", err);
            }
        };
    </script>
</body>
</html>
